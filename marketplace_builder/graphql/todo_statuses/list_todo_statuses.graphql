query list_todo_statuses($per_page: Int = 100, $page: Int = 1) {
  records(
    per_page: $per_page
    page: $page
    filter: {
      table: { value: "module_986" }
    }
    sort: { properties: [{ name: "module_field_986_2", order: ASC }] }
  ) {
    total_entries
    results {
      id
      properties
    }
  }
}
