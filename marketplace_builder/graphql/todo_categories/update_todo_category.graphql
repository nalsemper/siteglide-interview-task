mutation update_todo_category(
  $id: ID!
  $name: String
  $parent_id: Int
  $sort_order: Int
) {
  record_update(
    id: $id
    record: {
      properties: [
        { name: "name", value: $name }
        { name: "module_field_987_1", value_int: $parent_id }
        { name: "module_field_987_2", value_int: $sort_order }
      ]
    }
  ) {
    id
    properties
  }
}
